<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>npm Supply-Chain Audit</title>
    <meta
      name="description"
      content="Browser-based supply-chain audit for npm organizations: provenance & trusted-publishing rollout, manual publishes, and external maintainers."
    />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        const key = "npm-security-report:theme-mode";
        let stored = null;
        try {
          stored = localStorage.getItem(key);
        } catch {
          stored = null;
        }
        const mode =
          stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
        const resolved =
          mode === "system"
            ? window.matchMedia?.("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
