name: 𝜟 Dependency Diff (Analyze)

on:
  pull_request:

permissions: {}

jobs:
  diff-dependencies:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Analyze dependencies
        id: analyze
        uses: e18e/action-dependency-diff@9a7f09f5f2993256322e0db17ee4c8d9339dab77 # v1.7.1
        with:
          mode: artifact
          # Too noisy. Will enable if it ever supports reporting *changes* in duplicates.
          duplicate-threshold: "999"
          # Always report size diff.
          size-threshold: "-1"

      - name: Upload artifact
        if: steps.analyze.outputs.artifact-path
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e18e-diff-result
          path: ${{ steps.analyze.outputs.artifact-path }}
