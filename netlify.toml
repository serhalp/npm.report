[build]
command = "vite build"
publish = "dist"

[build.environment]
NODE_VERSION = "26"

[functions]
# Edge functions run on Deno, and Netlify's npm-in-edge bundling is still beta —
# it fails to load some clean-ESM third-party deps the audit graph pulls in
# (valibot, packumeta). This import map points the edge bundler at esm.sh so it
# resolves Deno-compatible builds at deploy time. The Vite browser build and
# vitest ignore this file and keep resolving the same bare specifiers from
# node_modules. Keep the pinned versions in import_map.json in sync with
# package.json. (drizzle-orm / @netlify/database are deliberately NOT mapped:
# they're Netlify-first-party and drizzle is a git-snapshot esm.sh can't build.)
deno_import_map = "./import_map.json"

# SPA: serve index.html for client-side routes.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-xwh0ztIl9GHVCIxpY9WA9wA4ops+/NNgJ9C0UKIv/L4='; connect-src 'self'"
