[build]
command = "vite build"
publish = "dist"

[build.environment]
NODE_VERSION = "26"

# SPA: serve index.html for client-side routes.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
# 'wasm-unsafe-eval' required by ghostty-web's WASM (oof)
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' 'sha256-xwh0ztIl9GHVCIxpY9WA9wA4ops+/NNgJ9C0UKIv/L4='; connect-src 'self'"
